linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosimple
    - bodyclose
    - misspell
linters-settings:
  errcheck:
    exclude-functions:
      - (net/http.ResponseWriter).Write
      - (*database/sql.Rows).Close
issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck]
    - path: cmd/(verify|loadtest|simulator)/
      linters: [errcheck]
